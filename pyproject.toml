[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ai-code-agent-cli"
version = "0.1.0"
description = "An autonomous code agent CLI with multi-provider LLM support and an interactive terminal UI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Sahil Sayyed", email = "sayyedsahil7800@gmail.com" },
]
keywords = ["ai", "agent", "cli", "llm", "code-agent", "openai", "anthropic", "gemini", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = [
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "typer>=0.12",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
gemini = ["google-genai>=0.3"]
all = [
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
ai-code-agent = "ai_code_agent.cli:app"
codeagent = "ai_code_agent.cli:app"

[project.urls]
Homepage = "https://github.com/ObsidianOS-labs/ai-code-agent-cli"
Repository = "https://github.com/ObsidianOS-labs/ai-code-agent-cli"
Issues = "https://github.com/ObsidianOS-labs/ai-code-agent-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_code_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_code_agent/prompts/system.md" = "ai_code_agent/prompts/system.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/ai_code_agent",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function calls in defaults (typer pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
